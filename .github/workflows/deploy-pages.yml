name: Build and Deploy Site

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 */6 * * *'   # after the 6-hourly data fetches ([skip ci] suppresses push triggers)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build site + Pagefind index (includes verification)
        run: python3 build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
