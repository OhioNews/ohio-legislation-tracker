name: Update Ohio Legislation Data

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Runs every day at 6:00 AM Eastern (11:00 AM UTC)
    - cron: '0 11 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
    
    - name: Run data fetch script
      env:
        LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
      run: |
        python fetch_ohio_legislation.py
    
    - name: Commit and push if changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add ohio_legislation_data/*.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Ohio legislation data $(date +'%Y-%m-%d %H:%M')" && git push)
