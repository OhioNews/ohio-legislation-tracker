name: Update Ohio News Feed

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 12 * * *'   # 8:00 AM EDT (morning scan)
    - cron: '0 18 * * *'   # 2:00 PM EDT (afternoon scan)
  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install feedparser requests

    - name: Fetch news feeds
      run: python fetch_ohio_news.py

    - name: Commit and push if changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add ohio_news_data/news.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Ohio news feed $(date +'%Y-%m-%d %H:%M')" && git push)
